<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MCR Asia Tour - The Light Project</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/nosleep/0.12.0/nosleep.min.js"></script>
    
    <style>
        :root {
            --c-abyss: #000000;         /* Pitch Black Background */
            --c-tour-red: #CE0313;      /* Famous Last Words Card Red */
            --c-blue-anthem: #0055ff;   /* Disenchanted Card Blue */
            --c-cyan-accent: #7DF9FF;   /* Ghostly Clone Cyan Glow */
            --c-surface: #121216;       /* Card/Toggle Surface */
            --c-silver: #FFFFFF;        /* Crisp White Text */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--c-abyss);
            color: var(--c-silver);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050505;
        }

        .phone-frame {
            width: 100%;
            max-width: 414px;
            height: 100%;
            max-height: 896px;
            background-color: var(--c-abyss);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border: 1px solid rgba(125, 249, 255, 0.15);
        }

        @media (min-width: 415px) {
            .phone-frame {
                border-radius: 40px;
                border: 8px solid #222;
                height: 844px;
            }
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            align-items: center;          /* Centers all contents horizontally */
            justify-content: center;      /* Centers contents vertically */
            height: 100%;
            overflow-y: auto;
            background: var(--c-abyss);
            padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px)) 24px;
            position: relative;
            text-align: center;           /* Ensures text aligns centrally */
        }

        .offline-banner {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background-color: rgba(0, 0, 0, 0.9);
            color: var(--c-cyan-accent);
            font-size: 0.7rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--c-cyan-accent);
            display: none;
            white-space: nowrap;
        }

        /* ---------- CENTERED HEADER ---------- */
        .header-block {
            text-align: center;
            margin-bottom: 18px;
            width: 100%;
        }

        .project-title-red {
            color: var(--c-tour-red);
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 4px;
            text-shadow: 0 0 15px rgba(206, 3, 19, 0.4);
        }

        .project-subtitle {
            color: #b3b3b3;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
        }

        .instructions-text {
            text-align: center;
            font-size: 0.78rem;
            color: #d1d5db;
            line-height: 1.4;
            margin-bottom: 18px;
            max-width: 320px;
        }

        /* ---------- SETTINGS CARD ---------- */
        .settings-card {
            background-color: rgba(25, 25, 30, 0.7);
            border: 1px solid rgba(125, 249, 255, 0.2);
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 340px;
            backdrop-filter: blur(10px);
        }

        .tip-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.75rem;
            color: #e5e7eb;
            margin-bottom: 10px;
        }

        .battery-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.78rem;
            color: #f3f4f6;
            font-weight: 500;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 8px;
        }

        /* Toggle Switch */
        .toggle-switch {
            position: relative;
            width: 44px;
            height: 22px;
            display: inline-block;
            cursor: pointer;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            inset: 0;
            background-color: #374151;
            border-radius: 22px;
            transition: 0.3s;
        }
        .slider::before {
            content: "";
            position: absolute;
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            border-radius: 50%;
            transition: 0.3s;
        }
        .toggle-switch input:checked + .slider {
            background-color: var(--c-tour-red);
        }
        .toggle-switch input:checked + .slider::before {
            transform: translateX(22px);
        }

        /* ---------- SQUARE CARDS GRID LAYOUT ---------- */
        .song-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 340px;
        }

        .song-tile {
            aspect-ratio: 1 / 1;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            border-radius: 16px;
            cursor: pointer;
            overflow: hidden;
            padding: 10px;
            transition: transform 0.15s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .song-tile:active { transform: scale(0.95); }

        .song-tile-title-box {
            position: relative;
            z-index: 1;
            width: 100%;
            background: rgba(20, 20, 24, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            padding: 8px 4px;
            text-align: center;
            font-weight: 800;
            font-size: 0.72rem;
            line-height: 1.2;
            color: #ffffff;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }

        .tile-flw {
            background: var(--c-tour-red);
            border: 1px solid rgba(255, 100, 100, 0.4);
        }

        .tile-disenchanted {
            background: var(--c-blue-anthem);
            border: 1px solid rgba(125, 249, 255, 0.4);
        }

        .tile-custom {
            grid-column: span 2;
            aspect-ratio: auto;
            padding: 14px;
            background: linear-gradient(135deg, #1f2937, #111827);
            border: 1px dashed var(--c-cyan-accent);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tile-custom .song-tile-title-box {
            width: auto;
            background: transparent;
            border: none;
            box-shadow: none;
            color: var(--c-cyan-accent);
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        /* ---------- CUSTOM COLOR PICKER PAGE ---------- */
        .custom-color-page {
            position: absolute;
            inset: 0;
            z-index: 9998;
            display: none;
            flex-direction: column;
            background: var(--c-abyss);
            color: #ffffff;
            padding: calc(16px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px)) 20px;
        }

        .ccp-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .ccp-back {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--c-surface);
            border: 1px solid var(--c-cyan-accent);
            color: #ffffff;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .ccp-preview-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ccp-glow-orb {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: hsl(185, 100%, 60%);
            box-shadow: 0 0 100px 40px hsla(185, 100%, 60%, 0.45);
            transition: background 0.05s linear, box-shadow 0.05s linear;
        }

        .ccp-slider-section {
            padding-bottom: 20px;
        }

        .ccp-slider-caption {
            text-align: center;
            font-size: 0.75rem;
            color: var(--c-cyan-accent);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 14px;
            font-weight: 700;
        }

        input[type="range"].ccp-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 40px;
            border-radius: 20px;
            outline: none;
            cursor: pointer;
            background: linear-gradient(90deg, #ff3b3b, #ff9d3b, #ffe13b, #a3ff3b, #3bffb3, #3bd6ff, #3b6bff, #b33bff, #ff3ba3, #ff3b3b);
            margin-bottom: 20px;
        }
        input[type="range"].ccp-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #ffffff;
            border: 3px solid #000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }

        .ccp-confirm {
            width: 100%;
            background-color: var(--c-cyan-accent);
            color: #000000;
            border: none;
            padding: 16px;
            font-weight: 900;
            border-radius: 14px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 0 20px rgba(125, 249, 255, 0.3);
        }

        /* ---------- FULL SCREEN LIGHT OVERLAY ---------- */
        .light-overlay {
            position: absolute;
            inset: 0;
            display: none;
            z-index: 9999;
            flex-direction: column;
            justify-content: flex-end;
        }

        .light-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            filter: brightness(1.35) saturate(1.25);
        }

        .light-bg.pulse {
            animation: vibrantPulse 1.4s ease-in-out infinite;
        }
        @keyframes vibrantPulse {
            0%, 100% { filter: brightness(1.4) saturate(1.3); }
            50% { filter: brightness(0.35) saturate(0.8); }
        }

        .curved-dock {
            position: relative;
            z-index: 2;
            background-color: var(--c-surface);
            border-radius: 36px 36px 0 0;
            padding: 16px 32px calc(24px + env(safe-area-inset-bottom, 0px)) 32px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
            border-top: 1px solid rgba(125, 249, 255, 0.2);
        }

        .curved-dock::before {
            content: "";
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 36px;
            background-color: var(--c-surface);
            border-radius: 45px 45px 0 0;
            border-top: 1px solid rgba(125, 249, 255, 0.2);
            z-index: -1;
        }

        .nav-action-btn {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #ffffff;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: color 0.2s ease;
        }
        .nav-action-btn:hover { color: var(--c-cyan-accent); }

        .nav-icon-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #000;
            border: 1px solid rgba(125, 249, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }
        .nav-action-btn.active .nav-icon-circle {
            background-color: var(--c-tour-red);
            border-color: var(--c-cyan-accent);
            color: #ffffff;
            box-shadow: 0 0 12px rgba(125, 249, 255, 0.6);
        }

        .dock-center-power {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background-color: #000;
            border: 2px solid var(--c-cyan-accent);
            color: var(--c-cyan-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.8);
            margin-top: -22px;
            font-size: 1.3rem;
            transition: transform 0.15s ease, background-color 0.2s ease;
        }
        .dock-center-power:active { transform: scale(0.92); }
        .dock-center-power:hover { background-color: rgba(125, 249, 255, 0.1); }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- Main Menu -->
        <div class="menu-container" id="menuContainer">
            <div id="offlineStatus" class="offline-banner">⚡ Offline Ready</div>

            <div class="header-block">
                <h1 class="project-title-red">MCR Fan Project</h1>
                <div class="project-subtitle">The Black Parade Light Show</div>
            </div>

            <p class="instructions-text">When it's time for the fan action, tap your song choice below to light up the stadium!</p>

            <div class="settings-card">
                <div class="tip-row">
                    <span>💡</span>
                    <span><strong>Tip:</strong> Turn phone brightness to max!</span>
                </div>
                <div class="battery-row">
                    <span>Battery Saver Mode</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="batteryToggle" onchange="toggleBatterySaver()">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <!-- Square Cards Grid (Centered) -->
            <div class="song-grid">
                <button type="button" class="song-tile tile-flw" onclick="activateLight('#CE0313')">
                    <div class="song-tile-title-box">Famous Last Words</div>
                </button>
                <button type="button" class="song-tile tile-disenchanted" onclick="activateLight('#0055ff')">
                    <div class="song-tile-title-box">Disenchanted</div>
                </button>
                <button type="button" class="song-tile tile-custom" onclick="openCustomColorPage()">
                    <div class="song-tile-title-box">⚡ Custom Hue Selector</div>
                </button>
            </div>
        </div>

        <!-- Custom Color Page -->
        <div class="custom-color-page" id="customColorPage">
            <div class="ccp-header">
                <button class="ccp-back" onclick="closeCustomColorPage()" aria-label="Back">&larr;</button>
            </div>
            <div class="ccp-preview-wrap">
                <div class="ccp-glow-orb" id="ccpGlowOrb"></div>
            </div>
            <div class="ccp-slider-section">
                <div class="ccp-slider-caption">Ghostly Clone Spectrum Selector</div>
                <input type="range" class="ccp-slider" id="ccpSlider" min="0" max="360" value="185">
                <button class="close-btn ccp-confirm" onclick="confirmCustomColor()">Illuminate Stadium</button>
            </div>
        </div>

        <!-- Active Light Overlay Screen -->
        <div class="light-overlay" id="lightOverlay">
            <div class="light-bg" id="lightBg"></div>

            <div class="curved-dock">
                <button class="nav-action-btn" id="navPulseBtn" onclick="togglePulse()">
                    <div class="nav-icon-circle">⚡</div>
                    <span>Pulse</span>
                </button>

                <button class="dock-center-power" onclick="deactivateLight()" title="Exit Light">
                    ⏻
                </button>

                <button class="nav-action-btn" onclick="openCustomColorPageFromLight()">
                    <div class="nav-icon-circle">🎨</div>
                    <span>Hue</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        function toggleBatterySaver() {
            document.body.classList.toggle('battery-saver', document.getElementById('batteryToggle').checked);
        }

        let noSleep = null;
        try {
            if (typeof NoSleep !== 'undefined') noSleep = new NoSleep();
        } catch (e) {}

        const menuContainer = document.getElementById('menuContainer');
        const customColorPage = document.getElementById('customColorPage');
        const lightOverlay = document.getElementById('lightOverlay');
        const lightBg = document.getElementById('lightBg');
        const navPulseBtn = document.getElementById('navPulseBtn');

        const ccpGlowOrb = document.getElementById('ccpGlowOrb');
        const ccpSlider = document.getElementById('ccpSlider');

        function hueToColor(hue) { return `hsl(${hue}, 100%, 60%)`; }
        function hueToGlow(hue) { return `hsla(${hue}, 100%, 60%, 0.65)`; }

        function updateGlowPreview(hue) {
            ccpGlowOrb.style.background = hueToColor(hue);
            ccpGlowOrb.style.boxShadow = `0 0 100px 40px ${hueToGlow(hue)}`;
        }

        ccpSlider.addEventListener('input', (e) => updateGlowPreview(e.target.value));

        function openCustomColorPage() {
            updateGlowPreview(ccpSlider.value);
            menuContainer.style.display = 'none';
            customColorPage.style.display = 'flex';
            lightOverlay.style.display = 'none';
        }

        function openCustomColorPageFromLight() {
            lightOverlay.style.display = 'none';
            openCustomColorPage();
        }

        function closeCustomColorPage() {
            customColorPage.style.display = 'none';
            menuContainer.style.display = 'flex';
        }

        function confirmCustomColor() {
            const color = hueToColor(ccpSlider.value);
            customColorPage.style.display = 'none';
            activateLight(color);
        }

        function togglePulse() {
            const isActive = lightBg.classList.toggle('pulse');
            navPulseBtn.classList.toggle('active', isActive);
            navPulseBtn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
        }

        function activateLight(colorHex) {
            if (navigator.vibrate) navigator.vibrate(50);
            if (noSleep) { try { noSleep.enable(); } catch (e) {} }

            lightBg.style.backgroundColor = colorHex;
            menuContainer.style.display = 'none';
            customColorPage.style.display = 'none';
            lightOverlay.style.display = 'flex';
        }

        function deactivateLight() {
            if (noSleep) { try { noSleep.disable(); } catch (e) {} }

            lightBg.classList.remove('pulse');
            navPulseBtn.classList.remove('active');
            navPulseBtn.setAttribute('aria-pressed', 'false');

            lightOverlay.style.display = 'none';
            menuContainer.style.display = 'flex';
        }
    </script>
</body>
</html>
