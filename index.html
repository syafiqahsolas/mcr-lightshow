<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MCR Fan Project - Concert Light Show</title>
    <!-- Include NoSleep.js to keep the phone screen from dimming/locking -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nosleep/0.12.0/nosleep.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0c10;
            color: #ffffff;
            overflow: hidden;
            transition: background-color 0.3s ease;
        }

        /* Battery Saver / Dark Theme Mode */
        body.battery-saver {
            background-color: #000000 !important;
        }
        body.battery-saver .menu-container {
            opacity: 0.85; /* Dims brightness slightly to save power */
        }

        /* Main Selection Menu Layout */
        .menu-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 20px;
            text-align: center;
            transition: opacity 0.3s ease;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            color: #ff0000;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #888888;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        p {
            font-size: 0.95rem;
            color: #c5c6c7;
            margin-bottom: 20px;
            max-width: 310px;
            line-height: 1.4;
        }

        /* Brightness & Toggle Box */
        .control-box {
            background-color: rgba(255, 255, 255, 0.05);
            border-left: 3px solid #ff0000;
            padding: 12px 15px;
            margin-bottom: 20px;
            max-width: 310px;
            width: 100%;
            text-align: left;
            border-radius: 4px;
            font-size: 0.85rem;
            color: #aaaaaa;
        }

        .toggle-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            cursor: pointer;
            color: #ffffff;
            font-weight: bold;
        }

        /* Toggle Switch Design */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333333;
            transition: .3s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #ff0000;
        }
        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .btn {
            width: 100%;
            max-width: 320px;
            padding: 18px;
            margin: 8px 0;
            font-size: 1.05rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: transform 0.1s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-song1 {
            background: linear-gradient(135deg, #ff0000, #990000);
            color: white;
        }

        .btn-song2 {
            background: linear-gradient(135deg, #1e3c72, #0d1b2a);
            color: white;
        }

        .footer-credit {
            position: absolute;
            bottom: 15px;
            font-size: 0.75rem;
            color: #555555;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Full Screen Light Overlay Layout */
        .light-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            z-index: 9999;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
        }

        .light-glow-text {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.4);
            animation: pulseText 2s infinite ease-in-out;
            margin-top: 10px;
        }

        @keyframes pulseText {
            0% { opacity: 0.2; }
            50% { opacity: 0.7; }
            100% { opacity: 0.2; }
        }

        .close-btn {
            background-color: rgba(0, 0, 0, 0.4);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
            padding: 12px 30px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- Main Entry Menu -->
    <div class="menu-container" id="menuContainer">
        <h1>MCR Fan Project</h1>
        <div class="subtitle">The Black Parade Light Show</div>
        
        <p>When it's time for the fan action, tap your song choice below to light up the stadium!</p>
        
        <!-- Control Box with Brightness Tip & Battery Saver Toggle -->
        <div class="control-box">
            💡 <strong>Tip:</strong> Turn phone brightness to max!<br>
            <label class="toggle-label">
                <span>🔋 Battery Saver Mode</span>
                <span class="switch">
                    <input type="checkbox" id="batteryToggle" onchange="toggleBatterySaver()">
                    <span class="slider"></span>
                </span>
            </label>
        </div>
        
        <!-- Buttons for Famous Last Words and Disenchanted -->
        <button class="btn btn-song1" onclick="activateLight('#FF0000')">Famous Last Words</button>
        <button class="btn btn-song2" onclick="activateLight('#00008B')">Disenchanted</button>

        <div class="footer-credit">Made by MCR Fans, For MCR Fans</div>
    </div>

    <!-- The Full-Screen Solid Color Screen with Center-Bottom Exit Button -->
    <div class="light-overlay" id="lightOverlay">
        <div class="light-glow-text">MCR Fan Project</div>
        <button class="close-btn" onclick="deactivateLight()">Exit Light</button>
    </div>

    <script>
        // 1. Battery Saver Mode Toggle Logic
        function toggleBatterySaver() {
            const body = document.body;
            const toggle = document.getElementById('batteryToggle');
            if (toggle.checked) {
                body.classList.add('battery-saver');
            } else {
                body.classList.remove('battery-saver');
            }
        }

        // 2. Register Service Worker for Offline PWA Caching
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch((err) => {
                    console.log('Service Worker registration skipped/failed: ', err);
                });
            });
        }

        // 3. NoSleep & Light Activation Code
        let noSleep = null;
        try {
            if (typeof NoSleep !== 'undefined') {
                noSleep = new NoSleep();
            }
        } catch (e) {
            console.log("NoSleep not supported or blocked");
        }

        const menuContainer = document.getElementById('menuContainer');
        const lightOverlay = document.getElementById('lightOverlay');

        function activateLight(colorHex) {
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }

            if (noSleep) {
                try { noSleep.enable(); } catch (e) {}
            }

            lightOverlay.style.backgroundColor = colorHex;
            menuContainer.style.display = 'none';
            lightOverlay.style.display = 'flex';

            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen();
            }
        }

        function deactivateLight() {
            if (noSleep) {
                try { noSleep.disable(); } catch (e) {}
            }

            lightOverlay.style.display = 'none';
            menuContainer.style.display = 'flex';

            if (document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        }
    </script>
</body>
</html>
